<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Battleground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&family=Barlow:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="view active" style="background:radial-gradient(ellipse at 50% 0%,#34157a 0%,#1a0b3d 55%,#0d0620 100%)">
    <div class="auth-page">
      <a href="/" class="auth-page-back">&larr; Back to arena</a>
      <h1 class="auth-page-title">BATTLEGROUND</h1>
      <p class="auth-page-subtitle" id="auth-subtitle">Sign in to sync your BattleDex</p>

      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login" type="button">Log in</button>
          <button class="auth-tab" id="tab-signup" type="button">Sign up</button>
        </div>

        <form id="auth-form" novalidate>
          <div class="auth-field">
            <label for="auth-email">Email</label>
            <input type="email" id="auth-email" autocomplete="email" placeholder="you@example.com" required>
            <span class="auth-field-error" id="email-error"></span>
          </div>
          <div class="auth-field">
            <label for="auth-password">Password</label>
            <input type="password" id="auth-password" autocomplete="current-password" placeholder="Min. 8 characters" required minlength="8">
            <span class="auth-field-error" id="password-error"></span>
          </div>
          <div class="auth-field" id="confirm-field" hidden>
            <label for="auth-confirm">Confirm password</label>
            <input type="password" id="auth-confirm" autocomplete="new-password" placeholder="Re-enter password">
            <span class="auth-field-error" id="confirm-error"></span>
          </div>

          <span class="auth-form-error" id="form-error"></span>
          <span class="auth-form-success" id="form-success"></span>

          <button type="submit" class="abtn abtn-gold auth-submit" id="auth-submit">Log in</button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <button class="auth-google-btn" id="google-btn" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>
      </div>
    </div>
    <div class="scanlines"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="storage.js"></script>
  <script>
    const form = document.getElementById('auth-form');
    const emailInput = document.getElementById('auth-email');
    const passwordInput = document.getElementById('auth-password');
    const confirmInput = document.getElementById('auth-confirm');
    const confirmField = document.getElementById('confirm-field');
    const emailError = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');
    const confirmError = document.getElementById('confirm-error');
    const formError = document.getElementById('form-error');
    const formSuccess = document.getElementById('form-success');
    const submitBtn = document.getElementById('auth-submit');
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');

    let mode = 'login';

    function setMode(m) {
      mode = m;
      tabLogin.classList.toggle('active', m === 'login');
      tabSignup.classList.toggle('active', m === 'signup');
      confirmField.hidden = m === 'login';
      submitBtn.textContent = m === 'login' ? 'Log in' : 'Sign up';
      passwordInput.autocomplete = m === 'login' ? 'current-password' : 'new-password';
      clearErrors();
    }

    tabLogin.addEventListener('click', () => setMode('login'));
    tabSignup.addEventListener('click', () => setMode('signup'));

    function clearErrors() {
      emailError.textContent = '';
      passwordError.textContent = '';
      confirmError.textContent = '';
      formError.textContent = '';
      formSuccess.textContent = '';
    }

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function validate() {
      clearErrors();
      let valid = true;
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email) {
        emailError.textContent = 'Email is required';
        valid = false;
      } else if (!validateEmail(email)) {
        emailError.textContent = 'Enter a valid email address';
        valid = false;
      }

      if (!password) {
        passwordError.textContent = 'Password is required';
        valid = false;
      } else if (password.length < 8) {
        passwordError.textContent = 'Must be at least 8 characters';
        valid = false;
      }

      if (mode === 'signup') {
        if (confirmInput.value !== password) {
          confirmError.textContent = 'Passwords do not match';
          valid = false;
        }
      }

      return valid;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validate()) return;

      submitBtn.disabled = true;
      submitBtn.textContent = mode === 'login' ? 'Logging in...' : 'Signing up...';
      clearErrors();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (mode === 'signup') {
        const result = await signUpWithEmail(email, password);
        if (result.error) {
          formError.textContent = result.error.message;
        } else if (result.needsConfirmation) {
          formSuccess.textContent = 'Check your email for a confirmation link to complete sign up.';
          form.reset();
        } else {
          window.location.href = '/';
        }
      } else {
        const { error } = await signInWithEmail(email, password);
        if (error) {
          formError.textContent = error.message;
        } else {
          window.location.href = '/';
        }
      }

      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'login' ? 'Log in' : 'Sign up';
    });

    document.getElementById('google-btn').addEventListener('click', () => signInWithGoogle());

    // If already logged in, redirect home
    initAuth().then(() => {
      if (isAuthenticated()) window.location.href = '/';
    });
  </script>
</body>
</html>
