<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Input View -->
  <section id="view-input" class="view">
    <h1 class="title">Battleground</h1>
    <p class="subtitle">Who would win in a fight?</p>
    <div class="input-row">
      <div class="fighter-input">
        <label for="fighter1">Fighter 1</label>
        <input type="text" id="fighter1" placeholder="e.g. Mike Tyson">
      </div>
      <span class="vs">vs</span>
      <div class="fighter-input">
        <label for="fighter2">Fighter 2</label>
        <input type="text" id="fighter2" placeholder="e.g. Bruce Lee">
      </div>
    </div>
    <button id="fight-btn" class="btn btn-fight">Fight</button>

    <a id="dex-link" href="/battledex.html" class="dex-link" hidden>BattleDex <span id="dex-count" class="dex-count">0</span></a>
  </section>

  <!-- Confetti canvas -->
  <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

  <!-- Result View (loading state is inline) -->
  <section id="view-result" class="view" hidden>
    <!-- Spinner shown while fetching verdict -->
    <div id="result-loading" class="loader-wrap">
      <div class="loader-fighters">
        <span id="loader-name-a" class="loader-fighter-name"></span>
        <div class="loader-clash">
          <div class="clash-ring"></div>
          <span class="clash-vs">VS</span>
        </div>
        <span id="loader-name-b" class="loader-fighter-name"></span>
      </div>
      <div class="loader-bar-track">
        <div class="loader-bar-fill"></div>
      </div>
      <p id="loader-fact" class="loader-fact"></p>
    </div>
    <!-- Content shown once verdict arrives -->
    <div id="result-content" hidden>
      <div class="fighters-display">
        <div class="fighter-card" id="card-a">
          <div class="fighter-img-wrap">
            <img id="img-a" class="fighter-img" src="" alt="">
            <span id="status-a" class="img-status" hidden></span>
          </div>
          <span id="name-a" class="fighter-card-name"></span>
          <button id="save-a" class="btn btn-save" hidden>Save</button>
        </div>
        <span class="vs-divider">VS</span>
        <div class="fighter-card" id="card-b">
          <div class="fighter-img-wrap">
            <img id="img-b" class="fighter-img" src="" alt="">
            <span id="status-b" class="img-status" hidden></span>
          </div>
          <span id="name-b" class="fighter-card-name"></span>
          <button id="save-b" class="btn btn-save" hidden>Save</button>
        </div>
      </div>
      <div class="winner-announce">
        <h2 class="result-label">Winner</h2>
        <h1 id="result-winner" class="result-name"></h1>
      </div>
      <p id="result-reasoning" class="result-reasoning"></p>
      <button id="back-btn" class="btn btn-secondary">Fight Again</button>
    </div>
  </section>

  <!-- Error View -->
  <section id="view-error" class="view" hidden>
    <div class="error-wrap">
      <span class="error-icon">!</span>
      <h2 class="error-title">Something went wrong</h2>
      <p id="error-message" class="error-text"></p>
      <button id="error-back-btn" class="btn btn-secondary">Try Again</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
